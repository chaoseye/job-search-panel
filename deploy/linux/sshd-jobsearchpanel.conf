# Job Search Panel (/etc/ssh/sshd_config.d/10-jobsearchpanel.conf; README, /srv/README): only the user
# jobremote may forward, and only to the panel on 127.0.0.1:8000 — the SSH tunnel of the laptop. Everything else stays
# as the global settings of the server have it (for example, no forwarding for other users). The keys of jobremote are
# restricted further in its authorized_keys (restrict, permitopen, command=). Installed by hand, checked with
# `sshd -t` and `sshd -T -C user=…` before `systemctl reload ssh`.
Match User jobremote
    AllowTcpForwarding local
    PermitOpen 127.0.0.1:8000
    AllowStreamLocalForwarding no
    PermitListen none
    X11Forwarding no
    AllowAgentForwarding no
    PermitTTY no

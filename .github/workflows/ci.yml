# The checks of a change: frontend types, build and tests; backend ruff, format, mypy and tests — the same list as
# `.\run.ps1 check` (keep the two in step; here as separate steps for readable logs and the caches). Two machines:
# Windows with Python 3.11 (development) and Ubuntu 24.04 with Python 3.12 (a Linux server of the panel; there also
# shellcheck of deploy/linux). Runs are limited to pull requests and master, and a newer push cancels the older run.
name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: "3.11"
          - os: ubuntu-24.04
            python: "3.12"
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Server scripts — shellcheck
        if: runner.os == 'Linux'
        run: shellcheck --severity=warning deploy/linux/*.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # the build goes first: backend tests of the SPA serving need frontend/dist
      - name: Frontend — install, types, build, tests
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm test

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Backend — install
        working-directory: backend
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Backend — ruff, format, mypy
        working-directory: backend
        run: |
          python -m ruff check app tests
          python -m ruff format --check app tests
          python -m mypy

      - name: Backend — tests
        working-directory: backend
        run: python -m pytest -q -n auto

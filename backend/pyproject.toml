[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jobsearchpanel"
version = "0.1.0"
description = "Job Search Panel backend: hh.ru applicant panel"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  # [asyncio] brings greenlet: since SQLAlchemy 2.1 it is no longer installed with plain `sqlalchemy`, and without it
  # the async engine fails on the first query
  "sqlalchemy[asyncio]>=2.0.30",
  "aiosqlite>=0.20",
  "alembic>=1.13",
  "httpx>=0.27",
  "apscheduler>=3.10,<4",
  "structlog>=24.1",
  "typer>=0.12",
  "python-multipart>=0.0.9",
  "pypdf>=4.2",
  "python-docx>=1.1",
  "nh3>=0.2",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "watchfiles>=0.22",
]

[project.optional-dependencies]
# what a server needs beyond the dependencies (deploy/linux installs these): the humanizer-ru scanner that checks letters
server = [
  "razdel>=0.5",
  "pymorphy3>=2.0",
]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-xdist>=3.5",  # `pytest -n auto`: the suite in ~6 min instead of ~11 (CI and run.ps1 test)
  "coverage>=7.4",
  "respx>=0.21",
  "ruff>=0.5",
  "mypy>=1.10",
  "pre-commit>=3.7",
  # property-based tests of backend/tests/audit_b (skipped when missing)
  "hypothesis>=6.100",
  # humanizer-ru scanner (.claude/skills/humanizer-ru/scripts/scan.py)
  "razdel>=0.5",
  "pymorphy3>=2.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.coverage.run]
# SQLAlchemy runs the ORM code of the async session in greenlets: without this coverage loses every line after an
# `await session.execute` (88 % measured as 79 %)
concurrency = ["greenlet", "thread"]
source = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
"app/db/migrations/**" = ["E501", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
files = ["app"]  # all of it strict (app/api, app/cli.py, app/db joined in the fifth audit batch)

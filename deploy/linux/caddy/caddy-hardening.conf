# /etc/systemd/system/caddy.service.d/10-jobsearchpanel.conf — the limits of the shared Caddy (/srv/README). The unit
# itself comes with the package; this drop-in is not the package's file and stays across its updates. Written by
# deploy/linux/proxy.sh install; README, «Ограничения Caddy». After a change: no other unit may be waiting for a
# reload (/srv/README, rule 4), then `systemctl daemon-reload` and `systemctl restart caddy`.
# Caddy is the only service of the server open to the internet: this is all it can do if it is ever broken into.
[Service]
# Binding 443 only. The package's unit also gives CAP_NET_ADMIN, which is for the UDP buffers of HTTP/3, and HTTP/3 is
# off here (`protocols h1 h2` in the Caddyfile); with it a broken Caddy could change network settings, the firewall
# included. These lists add up across the unit and its drop-ins: the empty line first drops what the package set.
AmbientCapabilities=
AmbientCapabilities=CAP_NET_BIND_SERVICE
CapabilityBoundingSet=
CapabilityBoundingSet=CAP_NET_BIND_SERVICE
NoNewPrivileges=true
# Read-only file system but /var/lib/caddy (home of the caddy user: certificates, ACME account, config autosave). There
# is no access log on purpose (jobsearchpanel.caddy), so no /var/log/caddy; a file log with rotation would also need
# SystemCallFilter=@chown.
ProtectSystem=strict
ReadWritePaths=/var/lib/caddy
ProtectHome=true
PrivateTmp=true
PrivateDevices=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectKernelLogs=true
ProtectControlGroups=true
ProtectClock=true
ProtectHostname=true
ProtectProc=invisible
ProcSubset=pid
RestrictNamespaces=true
RestrictRealtime=true
RestrictSUIDSGID=true
LockPersonality=true
MemoryDenyWriteExecute=true
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallFilter=~@privileged @resources
SystemCallErrorNumber=EPERM
UMask=0077
# A Caddy that crashed or was killed for its memory comes back by itself: the package's unit has no Restart=, and the
# public address would stay down until someone started it.
Restart=on-failure
RestartSec=5s
# Resources of a small proxy (/srv/README, rules 3 and 9): it takes about 12 MB; its CPU weight is that of the panel,
# below the default of other services (100). Caddy sets GOMEMLIMIT from MemoryMax by itself.
MemoryMax=256M
CPUWeight=50
CPUQuota=100%
